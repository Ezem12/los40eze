<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1430">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Los 40 del Eze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Lobster&family=Oswald:wght@500;600;700&family=Rye&display=swap">
<style>
/* Layout: una columna de celular con la paleta de la invitación (mostaza, azul, crema, celeste). Momentos abiertos arriba, ganadores de la noche abajo. Admin y ensayo en grilla. */
:root{
  --night:#0A1430; --navy:#12245A; --navy2:#1D3A7C; --mustard:#E0A526; --gold:#F6C744;
  --cream:#F7ECD4; --sky:#8FB6EA; --rose:#EE8FA6; --ink:#0A1430;
  --muted:rgba(247,236,212,.70); --line:rgba(143,182,234,.30); --ok:#7FD39A; --bad:#F08A7A;
  --display:'Rye',Georgia,'Times New Roman',serif;
  --label:'Oswald','Arial Narrow',Arial,sans-serif;
  --script:'Lobster','Brush Script MT',cursive;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 60% at 50% -10%,rgba(224,165,38,.24),transparent 60%),radial-gradient(90% 60% at 50% 115%,rgba(143,182,234,.14),transparent 60%)}
#app{position:relative;z-index:1}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}

.marquee{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:1.1;letter-spacing:.02em;color:var(--cream);
  text-shadow:0 0 22px rgba(246,199,68,.45),3px 3px 0 var(--navy2),5px 5px 0 var(--sky)}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:.35em;color:var(--gold);text-shadow:0 0 14px rgba(246,199,68,.6)}
.stars i{font-style:normal;font-size:1.3em}.stars i.big{font-size:1.9em}
.ribbon{display:inline-block;background:var(--navy2);color:var(--cream);font-family:var(--label);font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:.8rem;
  padding:.55em 2.3em;clip-path:polygon(0 0,100% 0,calc(100% - 1em) 50%,100% 100%,0 100%,1em 50%)}
.card{background:linear-gradient(180deg,rgba(29,58,124,.55),rgba(18,36,90,.55));border:1.5px solid var(--line);border-radius:16px;padding:18px}
.btn{font-family:var(--label);text-transform:uppercase;letter-spacing:.12em;font-weight:600;background:var(--mustard);color:var(--ink);border:0;border-radius:12px;
  padding:12px 18px;font-size:1rem;cursor:pointer;box-shadow:0 4px 0 #9B6F12;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #9B6F12}
.btn.sky{background:var(--sky);box-shadow:0 4px 0 #4F78B3}
.btn.ghost{background:transparent;color:var(--cream);border:1.5px solid var(--line);box-shadow:none}
.btn.danger{background:var(--bad);box-shadow:0 4px 0 #9E4B3F}
.btn.small{padding:8px 12px;font-size:.82rem}
.btn.armed{background:var(--cream);color:var(--ink);box-shadow:0 4px 0 #9B8F70}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp{width:100%;background:rgba(10,20,48,.75);color:var(--cream);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1.05rem}
.inp:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(246,199,68,.25)}
.lbl{font-family:var(--label);text-transform:uppercase;letter-spacing:.14em;font-size:.76rem;color:var(--sky)}
.muted{color:var(--muted)}
.note{font-size:.9rem;color:var(--muted)}
.err{color:var(--bad);font-size:.9rem}
.badge{display:inline-block;font-family:var(--label);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:6px;background:var(--navy2);color:var(--sky)}
.badge.open{background:rgba(127,211,154,.18);color:var(--ok)}
.badge.closed{background:rgba(246,199,68,.16);color:var(--gold)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--label);letter-spacing:.1em;text-transform:uppercase;font-size:.74rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line)}
.pill.on{color:var(--ok);border-color:rgba(127,211,154,.5)}.pill.off{color:var(--bad);border-color:rgba(240,138,122,.5)}.pill.gold{color:var(--gold);border-color:rgba(246,199,68,.5)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.linkbtn{background:none;border:0;color:var(--sky);text-decoration:underline;cursor:pointer;padding:4px;font-size:.95rem}
.net{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;text-align:center;background:var(--bad);color:var(--ink);font-family:var(--label);letter-spacing:.08em;
  text-transform:uppercase;font-size:.85rem;padding:6px;border-radius:10px}
.sec-title{display:flex;align-items:center;gap:10px;font-family:var(--label);text-transform:uppercase;letter-spacing:.16em;font-size:.82rem;color:var(--sky)}
.sec-title::before,.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}

/* ——— invitado ——— */
.guest{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
.g-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:6px}
.g-head .marquee{font-size:clamp(2.4rem,13vw,3.5rem)}
.g-head.compact .marquee{font-size:2rem}
.hello{text-align:center;font-family:var(--script);font-size:1.5rem;color:var(--gold)}
.join{display:flex;flex-direction:column;gap:12px}
.join h2{font-family:var(--label);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:1.3rem}
.mom{display:flex;flex-direction:column;gap:14px}
.mom h3{font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1.15}
.cands{display:flex;flex-direction:column;gap:8px}
.cand{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:rgba(10,20,48,.55);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.cand .nm{font-family:var(--label);font-weight:600;font-size:1.12rem;letter-spacing:.02em;flex:1;min-width:0;overflow-wrap:anywhere}
.cand .by{display:block;font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--muted);letter-spacing:0}
.cand .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:.9rem}
.cand.mine{border-color:var(--gold);background:rgba(224,165,38,.18)}
.cand.mine .ck{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.cand:disabled{cursor:wait;opacity:.7}
.nominate{display:flex;gap:8px}.nominate .inp{flex:1;min-width:0}
.hint{font-size:.88rem;color:var(--muted)}
.empty{text-align:center;display:flex;flex-direction:column;gap:10px;padding:26px 18px}
.empty .big{font-family:var(--script);font-size:1.9rem;color:var(--gold)}
.winner-card{display:flex;flex-direction:column;gap:8px;border-color:rgba(246,199,68,.45)}
.winner-card h3{font-family:var(--label);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:1rem;color:var(--sky)}
.winner-card .w{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.6rem;line-height:1.1;color:var(--gold);overflow-wrap:anywhere}
.winner-card .w .tr{font-size:1.4rem}
.podium{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--muted)}
.podium b{color:var(--cream);font-weight:600}
.g-foot{text-align:center;font-size:.85rem}
.back{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:rgba(10,20,48,.6);border:1.5px solid var(--line);color:var(--cream);border-radius:99px;padding:9px 16px;
  font-family:var(--label);text-transform:uppercase;letter-spacing:.1em;font-size:.85rem;cursor:pointer}
.back:hover{border-color:var(--gold)}
.menu{display:flex;flex-direction:column;gap:10px}
.menu-item{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:linear-gradient(180deg,rgba(29,58,124,.55),rgba(18,36,90,.55));border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;color:var(--cream)}
.menu-item:hover{border-color:var(--gold)}
.menu-item.pending{border-color:rgba(246,199,68,.6);box-shadow:0 0 0 1px rgba(246,199,68,.2)}
.menu-item .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:1.35rem;background:var(--mustard);color:var(--ink);flex:none;font-family:var(--label);font-weight:700}
.menu-item.trivia .ic{background:var(--sky)}
.menu-item.done .ic{background:rgba(127,211,154,.22);color:var(--ok)}
.menu-item.closed .ic{background:rgba(246,199,68,.16);color:var(--gold)}
.menu-item .tx{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.menu-item .tt{font-family:var(--display);font-size:1.18rem;line-height:1.15;overflow-wrap:anywhere}
.menu-item .st{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.menu-item.pending .st{color:var(--gold)}
.menu-item .go{font-size:1.7rem;color:var(--gold);flex:none;line-height:1}
.demo-note{text-align:center;font-size:.85rem;color:var(--gold)}

/* trivia */
.tq{display:flex;flex-direction:column;gap:14px}
.tq .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tq h2{font-family:var(--label);font-weight:600;font-size:1.4rem;line-height:1.2}
.tbar{height:10px;border-radius:99px;background:rgba(247,236,212,.12);overflow:hidden}
.tbar span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--mustard));transform-origin:left}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:92px;border:0;border-radius:14px;padding:12px;text-align:left;
  font-family:var(--label);font-weight:600;font-size:1.05rem;line-height:1.2;color:var(--ink);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.opt .sh{font-size:1.3rem}
.o0{background:var(--mustard)}.o1{background:var(--sky)}.o2{background:var(--cream)}.o3{background:var(--rose)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.3}.opt.right{outline:4px solid var(--ok);outline-offset:2px}.opt.wrong{outline:4px solid var(--bad);outline-offset:2px}
.score{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.score .big{font-family:var(--display);font-size:2.6rem;color:var(--gold);font-variant-numeric:tabular-nums}

/* ——— admin ——— */
.admin{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:16px 60px;display:flex;flex-direction:column;gap:16px}
.a-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.a-top h1{font-family:var(--display);font-weight:400;font-size:1.6rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--night);padding-block:8px}
.tab{font-family:var(--label);letter-spacing:.1em;text-transform:uppercase;font-weight:600;background:transparent;border:1.5px solid var(--line);color:var(--cream);border-radius:99px;padding:8px 16px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--mustard);color:var(--ink);border-color:var(--mustard)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;align-items:start}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(143,182,234,.12);border:1px solid var(--line);color:var(--cream);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.chip:hover{border-color:var(--gold)}
.rk{display:flex;flex-direction:column;gap:6px}
.rk li{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:rgba(10,20,48,.5)}
.rk li .n{margin-left:auto;color:var(--gold);font-variant-numeric:tabular-nums;font-weight:700}
.rk li .x{background:none;border:0;color:var(--bad);cursor:pointer;padding:2px 6px;font-size:.85rem}
.rk li .x.armed{color:var(--ink);background:var(--cream);border-radius:6px}
.win-line{font-family:var(--display);color:var(--gold);font-size:1.15rem}
.q-edit{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.q-edit input[type=radio]{width:22px;height:22px;accent-color:var(--gold)}
.q-num{font-family:var(--display);color:var(--gold);font-size:1.3rem}
.qr-box{background:var(--cream);border-radius:14px;padding:12px;width:220px;max-width:100%}
.qr-box svg{display:block;width:100%;height:auto}
.pin{max-width:360px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px;text-align:center}
.pin .inp{text-align:center;font-size:1.8rem;letter-spacing:.4em}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em;background:rgba(247,236,212,.08);padding:2px 6px;border-radius:6px;word-break:break-all}

/* ——— ensayo ——— */
.sim{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:16px 60px;display:flex;flex-direction:column;gap:18px}
.sim-bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.sim-bar h1{font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,3vw,2.2rem)}
.sim-help{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px;counter-reset:st}
.sim-help li{counter-increment:st;display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.sim-help li::before{content:counter(st);font-family:var(--display);color:var(--ink);background:var(--gold);border-radius:50%;min-width:28px;height:28px;display:grid;place-items:center}
.sim-main{display:grid;grid-template-columns:390px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.sim-main{grid-template-columns:minmax(0,1fr)}}
.sim-slot{display:flex;flex-direction:column;gap:8px;min-width:0}
.sim-phone{height:min(780px,88vh);overflow-y:auto;border-radius:34px;border:10px solid #050B1C;background:var(--night);box-shadow:0 0 0 1.5px var(--line),0 20px 50px rgba(0,0,0,.5);width:100%;max-width:390px;position:sticky;top:12px}
.sim-phone .guest{padding-inline:14px}
.sim-admin{border:1.5px solid var(--line);border-radius:14px;background:rgba(10,20,48,.6)}
.sim-admin .admin{max-width:none}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}
</style>

<div id="app"></div>

/* ---------- árbol de datos ---------- */
function getAt(o,parts){ for(const p of parts){ if(o==null||typeof o!=='object') return null; o=o[p]; } return o===undefined?null:o; }
function setAt(root,parts,val){
  if(!parts.length) return (val===undefined?null:val);
  root=(root&&typeof root==='object')?root:{};
  const [h,...t]=parts; const nv=setAt(root[h],t,val);
  if(nv===null||nv===undefined) delete root[h]; else root[h]=nv;
  return Object.keys(root).length?root:null;
}
const clone=v=>v==null?null:JSON.parse(JSON.stringify(v));

/* ---------- Supabase (tabla "fiesta": path → value), sin SDK: liviano ---------- */
function supaStore(base,key){
  const H={apikey:key,'Content-Type':'application/json'}; if(/^eyJ/.test(key)) H.Authorization='Bearer '+key;
  const T=base+'/rest/v1/fiesta';
  const join=(p,k)=>[...split(p),...split(k)].join('/');
  const filt=(eqs,likes)=>{ const parts=[...eqs.map(p=>'path.eq.'+p),...likes.map(p=>'path.like.'+p+'/*')]; return parts.length?'or=('+parts.join(',')+')':''; };
  async function req(url,opt={}){
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),10000);
    try{ const r=await fetch(url,{...opt,headers:{...H,...(opt.headers||{})},signal:ctl.signal});
      if(!r.ok) throw new Error('HTTP '+r.status); const t=await r.text(); return t?JSON.parse(t):null; }
    finally{ clearTimeout(to) }
  }
  async function rows(paths){
    const all=paths.some(p=>!p); const f=all?'':filt(paths,paths); let out=[], off=0;
    for(;;){ const page=await req(`${T}?select=path,value${f?'&'+f:''}&order=path.asc&limit=1000&offset=${off}`)||[]; out=out.concat(page); if(page.length<1000) break; off+=1000; }
    return out;
  }
  function build(rs){ rs.sort((x,y)=>split(x.path).length-split(y.path).length); let t=null; for(const r of rs) t=setAt(t,split(r.path),clone(r.value)); return t; }
  async function del(eqs,likes){ const all=eqs.includes(''); const f=all?'path=neq.__ninguno__':filt(eqs,likes); if(!f) return; await req(`${T}?${f}`,{method:'DELETE',headers:{Prefer:'return=minimal'}}); }
  async function upsert(list){ if(!list.length) return; await req(T,{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(list.map(([path,value])=>({path,value})))}); }
  // escribe un conjunto de cambios {ruta: valor|null} respetando la semántica de árbol
  async function apply(changes){
    const eqDel=[], likeDel=[], ups=[];
    const structural=changes.some(([path])=>!/^(votes|tanswers|players|rev)(\/|$)/.test(path));
    for(const [path,v] of changes){
      if(!path){ eqDel.push(''); if(v&&typeof v==='object') for(const k in v){ const c=v[k]; if(c&&typeof c==='object'&&!Array.isArray(c)) for(const j in c) ups.push([k+'/'+j,c[j]]); else ups.push([k,c]); } continue; }
      likeDel.push(path); if(v==null) eqDel.push(path);
      else if(split(path).length<2 && v && typeof v==='object' && !Array.isArray(v)){ eqDel.push(path); for(const k in v) ups.push([path+'/'+k,v[k]]); }
      else ups.push([path,v]);
    }
    if(structural) ups.push(['rev',Date.now()]);
    await del(eqDel,likeDel); await upsert(ups);
  }
  return {
    kind:'supabase',
    get:async p=>clone(getAt(build(await rows([p])),split(p))),
    multi:async ps=>{ const t=build(await rows(ps)); return ps.map(p=>clone(getAt(t,split(p)))); },
    set:(p,v)=>apply([[split(p).join('/'),v]]),
    update:(p,obj)=>apply(Object.keys(obj).map(k=>[join(p,k),obj[k]])),
    remove:p=>apply([[split(p).join('/'),null]]),
    stream(p,cb,onStatus){
      let last='', stop=false, t=null;
      const tick=async()=>{ try{ const v=await this.get(p); onStatus&&onStatus(true); const j=JSON.stringify(v); if(j!==last){ last=j; cb(v); } }catch(e){ onStatus&&onStatus(false); }
        if(!stop) t=setTimeout(tick,3000); };
      tick(); return ()=>{ stop=true; clearTimeout(t); };
    }
  };
}
/* ---------- Modo ensayo: guarda en este navegador y sincroniza pestañas ---------- */
function localStore(){
  const KEY='f40-demo2'; const subs=new Set();
  const load=()=>{ try{ return JSON.parse(localStorage.getItem(KEY)) }catch(e){ return null } };
  let tree=load(); let bc=null; try{ bc=new BroadcastChannel('f40b') }catch(e){}
  const notify=()=>subs.forEach(s=>s());
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(tree)) }catch(e){} try{ bc&&bc.postMessage(tree) }catch(e){} notify(); };
  if(bc) bc.onmessage=e=>{ tree=e.data; notify(); };
  window.addEventListener('storage',e=>{ if(e.key===KEY){ tree=load(); notify(); } });
  return {
    kind:'demo',
    get:async p=>clone(getAt(tree,split(p))),
    set:async(p,v)=>{ tree=setAt(tree,split(p),clone(v)); save(); },
    update:async(p,v)=>{ for(const k in v) tree=setAt(tree,[...split(p),...split(k)],clone(v[k])); save(); },
    remove:async p=>{ tree=setAt(tree,split(p),null); save(); },
    multi:async ps=>ps.map(p=>clone(getAt(tree,split(p)))),
    stream(p,cb,onStatus){ const s=()=>cb(clone(getAt(tree,split(p)))); subs.add(s); setTimeout(s,0); onStatus&&onStatus(true); return ()=>subs.delete(s); }
  };
}

function seed(force){
  if(seeding&&!force) return seeding;
  const qs={}; DEFAULT_QS.forEach((q,i)=>qs['q'+(i+1)]={...q,order:i+1});
  seeding=(async()=>{

/* ---------- lógica ---------- */
const norm=s=>String(s||'').replace(/&|\+|,|\//g,' y ').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
  .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim().split(/ y | e /).map(x=>x.trim()).filter(Boolean).sort().join(' y ');
const sortedQs=qs=>Object.entries(qs||{}).map(([id,q])=>({id,...q})).sort((a,b)=>(a.order||0)-(b.order||0));
const momentList=ms=>Object.entries(ms||{}).map(([id,m])=>({id,...m}));
const candList=m=>Object.entries(m?.cands||{}).map(([id,c])=>({id,...c})).sort((a,b)=>(a.t||0)-(b.t||0));
function countVotes(m,votes){
  const cs=candList(m); const n={}; cs.forEach(c=>n[c.id]=0); let total=0;
  for(const d in votes||{}){ const c=votes[d]?.c; if(c in n){ n[c]++; total++; } }
  return {rank:cs.map(c=>({...c,n:n[c.id]})).sort((a,b)=>b.n-a.n||(a.t||0)-(b.t||0)), total};
}
function points(q,a){
  if(!q||!a||Number(a.a)!==Number(q.correct)) return 0;
  const T=(Number(q.time)||20)*1000; if(a.ms>T+1500) return 0;
  return Math.round(1000-500*Math.max(0,Math.min(1,a.ms/T)));
}
// Puntaje: primero cuentan los aciertos; a igual aciertos gana quien terminó en menos tiempo.
// pts = aciertos×1000 + bonus de rapidez (0–999 según el tiempo total usado).
function scoreOf(qsMap,ans){
  const list=sortedQs(qsMap); let ok=0, used=0, lim=0;
  for(const q of list){ const T=(Number(q.time)||20)*1000; lim+=T; const a=ans?.[q.id];
    used+= a&&a.a>=0 ? Math.min(a.ms,T) : T; if(points(q,a)>0) ok++; }
  const bonus= ok&&lim ? Math.round(999*Math.max(0,1-used/lim)) : 0;
  return {ok, n:list.length, secs:Math.round(used/100)/10, pts:ok*1000+bonus};
}
const fmtSecs=x=>String(x).replace('.',',')+' s';
const scoreTxt=x=>`${x.ok} de ${x.n} · ${fmtSecs(x.secs)}`;
function triviaScores(root,mid){
  const all=root?.tanswers?.[mid]||{}, pl=root?.players||{}; const out=[];
  for(const dev in all){ let by=''; for(const qid in all[dev]) by=all[dev][qid]?.by||by;
    out.push({dev,nick:pl[dev]?.nick||by||'Anónimo',...scoreOf(root?.questions,all[dev])}); }
  return out.sort((a,b)=>b.pts-a.pts);
}

    :online?`<span class="pill on" id="conn"><span class="dot"></span>Conectado</span>`:`<span class="pill off" id="conn"><span class="dot"></span>Sin conexión</span>`;

  function render(){
    const players=Object.keys(root?.players||{}).length;
    const tabs=[['momentos','Momentos'],['trivia','Preguntas trivia'],['ajustes','Link y ajustes']];
    app.innerHTML=`<div class="a-top"><h1>Panel · Los 40</h1><div class="row">${connPill()}<span class="pill">${players} ${players===1?'invitado':'invitados'}</span>${app.closest('.sim')?'':'<a class="btn sky small" href="#jugar">🎉 Jugar como invitado</a>'}</div></div>
      <nav class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${tab===k}" data-act="tab" data-v="${k}">${l}</button>`).join('')}</nav>
      <div id="tabbody">${tab==='trivia'?triviaHTML():tab==='ajustes'?ajustesHTML():momentosHTML()}</div>`;
  }
  function momentosHTML(){
    const list=momentList(root?.moments);
    const rank={open:0,draft:1,closed:2};
    list.sort((a,b)=>rank[a.status]-rank[b.status]||(b.openedAt||b.t||0)-(a.openedAt||a.t||0));
    const existing=new Set(list.map(m=>norm(m.title)));
    const chips=SUGGESTED.filter(([t])=>!existing.has(norm(t)));
    return `<section class="card stack"><h3 class="lbl" style="font-size:.9rem">Sumar un momento</h3>
      <form id="newm" class="stack">
        <div class="grid" style="gap:10px"><div class="stack" style="gap:6px"><label class="lbl" for="nm-title">Nombre del juego</label><input id="nm-title" class="inp" maxlength="60" placeholder="Ej: El que mejor baila cumbia" required></div>
        <div class="stack" style="gap:6px"><label class="lbl" for="nm-desc">Descripción (opcional)</label><input id="nm-desc" class="inp" maxlength="120" placeholder="Ej: Vale postularse uno mismo"></div></div>
        <div class="row"><label class="lbl" for="nm-type">Tipo</label><select id="nm-type" class="inp" style="width:auto"><option value="voto">Postular y votar</option><option value="trivia">Trivia sobre Eze</option></select>
          <button class="btn" type="button" data-act="createOpen">Abrir ahora</button><button class="btn ghost" type="submit">Guardar para después</button></div>
      </form>
      ${chips.length?`<div class="stack" style="gap:6px"><span class="note">Atajos (se guardan para después, los abrís cuando quieras):</span><div class="chips">${chips.map(([t,ty])=>`<button class="chip" data-act="quick" data-t="${esc(t)}" data-ty="${ty}">+ ${esc(t)}</button>`).join('')}</div></div>`:''}
      </section>
      ${list.length?`<div class="grid">${list.map(momentCard).join('')}</div>`:'<p class="note">Todavía no hay momentos. Sumá el primero arriba o tocá un atajo.</p>'}`;
  }
  function momentCard(m){
    const st={open:['open','Abierto'],draft:['','Guardado'],closed:['closed','Cerrado']}[m.status]||['','—'];
    let body='';
    if(m.type==='trivia'){
      const s=triviaScores(root,m.id);
      body=`<p class="note">${s.length} ${s.length===1?'jugó':'jugaron'}</p>${s.length?`<ol class="rk">${s.slice(0,5).map((x,i)=>`<li>${i+1}. ${esc(x.nick)}<span class="n">${scoreTxt(x)}</span></li>`).join('')}</ol>`:''}`;
    }else{
      const {rank,total}=countVotes(m,root?.votes?.[m.id]);
      body=`<p class="note">${rank.length} ${rank.length===1?'candidato':'candidatos'} · ${total} ${total===1?'voto':'votos'} <span class="muted">(los votos solo los ves vos)</span></p>
        ${rank.length?`<ol class="rk">${rank.map(c=>`<li><span>${esc(c.name)}</span><span class="n">${c.n}</span><button class="x" data-act="delc" data-m="${m.id}" data-c="${c.id}" aria-label="Sacar a ${esc(c.name)}">✕</button></li>`).join('')}</ol>`:''}
        ${m.status!=='closed'?`<form class="nominate" data-addc="${m.id}"><label class="lbl" for="ac-${m.id}" hidden>Agregar candidato</label><input id="ac-${m.id}" class="inp" maxlength="40" placeholder="Agregar candidato" required><button class="btn sky small" type="submit">Agregar</button></form>
        <label class="lbl" for="jw-${m.id}">Ganador del jurado (opcional, pisa la votación)</label><input id="jw-${m.id}" class="inp" data-f="jury" data-id="${m.id}" value="${esc(m.jury||'')}" maxlength="60" placeholder="Dejalo vacío para usar los votos">`:''}`;
    }
    const win=m.status==='closed'&&m.winner?`<p class="win-line">🏆 ${esc(m.winner.name)}</p>`:'';
    const actions=m.status==='draft'?`<button class="btn" data-act="open" data-id="${m.id}">Abrir ahora</button>`
      :m.status==='open'?`<button class="btn" data-act="close" data-id="${m.id}">Cerrar y mostrar ganador</button>`
      :`<button class="btn ghost small" data-act="reopen" data-id="${m.id}">Reabrir</button>`;
    return `<section class="card stack"><div class="row" style="justify-content:space-between"><span class="badge ${st[0]}">${st[1]}</span><span class="badge">${m.type==='trivia'?'Trivia':'Postular y votar'}</span></div>
      <label class="lbl" for="mt-${m.id}">Nombre</label><input id="mt-${m.id}" class="inp" data-f="title" data-id="${m.id}" value="${esc(m.title)}" maxlength="60">
      <input id="md-${m.id}" class="inp" data-f="desc" data-id="${m.id}" value="${esc(m.desc||'')}" maxlength="120" placeholder="Descripción (opcional)" aria-label="Descripción">
      ${body}${win}<div class="row">${actions}<button class="btn danger small" data-act="delm" data-id="${m.id}">Borrar</button></div><p class="err" id="ae-${m.id}" hidden></p></section>`;
  }
  function triviaHTML(){
    const qs=sortedQs(root?.questions);
    return `<p class="note">Estas preguntas se usan en la trivia. Cada invitado las responde a su ritmo desde el celu. Puntaje: gana quien acierta más; si empatan, el que terminó la trivia en menos tiempo.</p>
      <div class="stack">${qs.map((q,i)=>`<section class="card stack">
        <div class="row" style="justify-content:space-between"><span class="q-num">${i+1}</span>
          <div class="row"><button class="btn ghost small" data-act="up" data-id="${q.id}" aria-label="Subir">↑</button><button class="btn ghost small" data-act="down" data-id="${q.id}" aria-label="Bajar">↓</button>
          <button class="btn danger small" data-act="delQ" data-id="${q.id}">Borrar</button></div></div>
        <label class="lbl" for="qq-${q.id}">Pregunta</label><input id="qq-${q.id}" class="inp" data-f="q" data-id="${q.id}" value="${esc(q.q)}" maxlength="140">
        <span class="lbl">Opciones (marcá la correcta)</span>
        <div class="q-edit">${[0,1,2,3].map(j=>`<input type="radio" name="rc-${q.id}" id="rc-${q.id}-${j}" data-f="correct" data-id="${q.id}" value="${j}" ${Number(q.correct)===j?'checked':''} aria-label="Correcta: opción ${j+1}">
          <input class="inp" id="qo-${q.id}-${j}" data-f="opt" data-id="${q.id}" data-i="${j}" value="${esc(q.opts?.[j]||'')}" maxlength="90" placeholder="${SHAPES[j]} Opción ${j+1}">`).join('')}</div>
        <div class="row"><label class="lbl" for="qt-${q.id}">Tiempo</label><select id="qt-${q.id}" class="inp" style="width:auto" data-f="time" data-id="${q.id}">${[10,15,20,30].map(s=>`<option value="${s}" ${Number(q.time)===s?'selected':''}>${s} segundos</option>`).join('')}</select></div>
      </section>`).join('')}<button class="btn sky" data-act="addQ" style="align-self:flex-start">+ Agregar pregunta</button></div>`;
  }
  function ajustesHTML(){
    return `<div class="grid">
      <section class="card stack"><h3 class="lbl" style="font-size:.9rem">Link para los invitados</h3>
        <div class="qr-box">${qrSVG(guestURL())}</div><code id="glink">${esc(guestURL())}</code>
        <div class="row"><button class="btn small" data-act="copy">Copiar link</button><span class="note" id="copyok"></span></div>
        <p class="note">Imprimí este QR para las mesas o mandá el link por WhatsApp.</p></section>
      <section class="card stack"><h3 class="lbl" style="font-size:.9rem">Conexión</h3>
        ${store.kind==='demo'?`<p><b>Modo ensayo.</b> Todo se guarda en este navegador. Sirve para probar, no para la fiesta.</p><p class="note">Para la noche: cargá los datos de Supabase en CONFIG dentro del archivo.</p>`
          :`<p>Conectado a Supabase:</p><code>${esc(SB_URL)}</code>`}
        <p class="note">El PIN se cambia en CONFIG.PIN dentro del archivo.</p>
        <button class="btn ghost small" data-act="logout" style="align-self:flex-start">Cerrar sesión del panel</button></section>
      <section class="card stack"><h3 class="lbl" style="font-size:.9rem">Después de la prueba</h3>
        <button class="btn danger" data-act="resetVotes">Borrar votos, candidatos y trivia</button>
        <button class="btn danger" data-act="resetAll">Borrar todo (momentos, invitados, preguntas)</button>
        <p class="note">Te pide tocar dos veces. El primero deja tus momentos armados; los celulares de la prueba pueden volver a votar.</p></section></div>`;
  }

  async function createMoment(status,title,type,desc){
    title=String(title??$('#nm-title')?.value??'').trim(); type=type||$('#nm-type')?.value||'voto'; desc=String(desc??$('#nm-desc')?.value??'').trim();
    if(title.length<2){ const i=$('#nm-title'); if(i){ i.focus(); i.reportValidity?.(); } return; }
    const id=uid('m'); const now=Date.now();
    await store.set('moments/'+id,{title,desc,type,status,t:now,...(status==='open'?{openedAt:now}:{})});
    const a=$('#nm-title'), b=$('#nm-desc'); if(a) a.value=''; if(b) b.value='';
  }
  async function adminAddCand(mid,inp){
    const name=inp.value.replace(/\s+/g,' ').trim(); if(name.length<2) return;
    const m=root?.moments?.[mid]; if(candList(m).some(c=>norm(c.name)===norm(name))){ showErr(mid,'Ya está en la lista.'); return; }
    await store.set(`moments/${mid}/cands/${uid('c')}`,{name,by:'Eze',t:Date.now()}); inp.value='';
  }
  function closeData(m){
    if(m.type==='trivia'){ const s=triviaScores(root,m.id); if(!s.length) return null;
      const top=s.filter(x=>x.pts===s[0].pts); return {winner:{name:top.map(x=>x.nick).join(' / '),pts:s[0].pts},podium:s.slice(0,3).map(x=>({name:x.nick,n:x.pts,txt:scoreTxt(x)}))}; }
    const jury=String(m.jury||'').trim(); const {rank,total}=countVotes(m,root?.votes?.[m.id]);
    const podium=rank.filter(c=>c.n>0).slice(0,3).map(c=>({name:c.name,n:c.n}));
    if(jury) return {winner:{name:jury,jury:true},podium};
    if(!total) return null;
    const top=rank.filter(c=>c.n===rank[0].n); return {winner:{name:top.map(c=>c.name).join(' / '),votes:rank[0].n,total},podium};
  }
  async function onClick(e){
    const b=e.target.closest('[data-act]'); if(!b) return; const act=b.dataset.act, id=b.dataset.id;
    try{
      if(act==='tab'){ tab=b.dataset.v; ssSet('f40-tab',tab); render(); return; }
      if(act==='createOpen'){ await createMoment('open'); return; }
      if(act==='quick'){ await createMoment('draft',b.dataset.t,b.dataset.ty,''); return; }
      if(act==='open'||act==='reopen'){ await store.update('moments/'+id,{status:'open',openedAt:Date.now(),winner:null,podium:null,closedAt:null}); return; }
      if(act==='close'){ const m=root?.moments?.[id]; const d=closeData({id,...m});
        if(!d){ showErr(id,m?.type==='trivia'?'Todavía nadie jugó la trivia.':'No hay votos todavía. Esperá votos o cargá un ganador del jurado.'); return; }
        await store.update('moments/'+id,{status:'closed',closedAt:Date.now(),winner:d.winner,podium:d.podium}); return; }
      if(act==='delm'){ if(!armed(b)) return; await store.update('',{['moments/'+id]:null,['votes/'+id]:null,['tanswers/'+id]:null}); return; }
      if(act==='delc'){ if(!armed(b,'¿Sacar?')) return; await store.remove(`moments/${b.dataset.m}/cands/${b.dataset.c}`); return; }
      if(act==='addQ'){ const qs=sortedQs(root?.questions); await store.set('questions/'+uid('q'),{q:'Nueva pregunta sobre Eze',opts:['Opción 1','Opción 2','Opción 3','Opción 4'],correct:0,time:20,order:(qs.at(-1)?.order||0)+1}); return; }
      if(act==='up'||act==='down'){ const qs=sortedQs(root?.questions); const i=qs.findIndex(q=>q.id===id); const j=act==='up'?i-1:i+1; if(j<0||j>=qs.length) return;
        [qs[i],qs[j]]=[qs[j],qs[i]]; await store.update('questions',Object.fromEntries(qs.map((q,k)=>[`${q.id}/order`,k+1]))); return; }
      if(act==='delQ'){ if(!armed(b)) return; await store.remove('questions/'+id); return; }
      if(act==='copy'){ const t=guestURL(); try{ await navigator.clipboard.writeText(t); $('#copyok').textContent='Copiado ✓'; }catch(_){ const r=document.createRange(); r.selectNodeContents($('#glink')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); $('#copyok').textContent='Quedó seleccionado: copialo'; } return; }
      if(act==='logout'){ ssSet('f40-pin',''); location.reload(); return; }
      if(act==='resetVotes'){ if(!armed(b)) return; const ups={votes:null,tanswers:null,'meta/epoch':Date.now()};
        for(const m of momentList(root?.moments)) Object.assign(ups,{[`moments/${m.id}/cands`]:null,[`moments/${m.id}/winner`]:null,[`moments/${m.id}/podium`]:null,[`moments/${m.id}/jury`]:null,[`moments/${m.id}/closedAt`]:null,[`moments/${m.id}/status`]:m.status==='closed'?'draft':m.status});
        await store.update('',ups); return; }
      if(act==='resetAll'){ if(!armed(b)) return; seeded=true; await seed(true); return; }
    }catch(err){ flash('No se pudo guardar. Revisá la conexión y probá de nuevo.'); }
  }
  async function onChange(e){
    const el=e.target; const f=el.dataset.f, id=el.dataset.id; if(!f) return;
    try{
      if(f==='title') await store.update('moments/'+id,{title:el.value.trim()||'Sin nombre'});
      if(f==='desc') await store.update('moments/'+id,{desc:el.value.trim()});
      if(f==='jury') await store.update('moments/'+id,{jury:el.value.trim()||null});
      if(f==='q') await store.update('questions/'+id,{q:el.value.trim()});
      if(f==='opt') await store.update('questions/'+id,{[`opts/${el.dataset.i}`]:el.value.trim()});
      if(f==='correct') await store.update('questions/'+id,{correct:Number(el.value)});
      if(f==='time') await store.update('questions/'+id,{time:Number(el.value)});
    }catch(err){ flash('No se pudo guardar el cambio. Revisá la conexión.'); }
  }
  function showErr(id,msg){ const el=$('#ae-'+id); if(el){ el.textContent=msg; el.hidden=false; setTimeout(()=>{ if(el.isConnected) el.hidden=true },5000); } }
  function flash(msg){ let el=$('#aerr'); if(!el){ app.insertAdjacentHTML('afterbegin','<p class="net" id="aerr"></p>'); el=$('#aerr'); } el.textContent=msg; setTimeout(()=>el.remove(),4000); }
  function pinGate(){
    app.innerHTML=`<form class="card pin" id="pinf"><div class="stars"><i>★</i><i class="big">★</i><i>★</i></div><h1 class="marquee" style="font-size:2rem">Panel admin</h1>
      <label class="lbl" for="pin">PIN</label><input id="pin" class="inp" inputmode="numeric" autocomplete="off" maxlength="8" required>
      <button class="btn" type="submit">Entrar</button><p class="err" id="pinerr" hidden>PIN incorrecto.</p></form>`;
    $('#pinf').addEventListener('submit',e=>{ e.preventDefault(); if($('#pin').value===CONFIG.PIN){ ssSet('f40-pin','ok'); adminView(app); } else { $('#pinerr').hidden=false; $('#pin').value=''; } });
  }
}

/* =========================================================
   MODO ENSAYO: celular + panel juntos, con invitados simulados
   ========================================================= */
const BOTS=['Lau','Colo','Tía Marta','Juanchi','Vero','Pato','Caro','Nico','Flor','Gringo','Sole','Rulo'];
const BOT_PAIRS=['Lau y Eze','Vero y Pato','Caro y Nico','Flor y Gringo'];
const biased=arr=>arr[Math.floor(Math.pow(Math.random(),2)*arr.length)];
async function simBots(){
  const root=await store.get('')||{}; const ups={};
  BOTS.forEach((n,i)=>ups[`players/bot${i}`]={nick:n,t:Date.now()});
  for(const m of momentList(root.moments).filter(m=>m.status==='open')){
    if(m.type==='trivia'){
      const qs=sortedQs(root.questions);
      BOTS.forEach((n,i)=>{ qs.forEach((q,k)=>{ const ok=Math.random()<.6; const wrong=[0,1,2,3].filter(x=>x!==Number(q.correct));
        ups[`tanswers/${m.id}/bot${i}/${q.id}`]={a:ok?Number(q.correct):wrong[(i+k)%3],ms:Math.round(1500+Math.random()*(Number(q.time)||20)*700),by:n}; }); });
      continue;
    }
    const cands={...(m.cands||{})}; const pool=/pareja/i.test(m.title)?BOT_PAIRS:BOTS.slice(0,5);
    pool.slice(0,4).forEach((name,k)=>{ if(!Object.values(cands).some(c=>norm(c.name)===norm(name))){ const cid=`cb${k}${m.id.slice(-5)}`; const c={name,by:BOTS[(k+3)%BOTS.length],self:k===1,t:Date.now()+k};
      cands[cid]=c; ups[`moments/${m.id}/cands/${cid}`]=c; } });
    const ids=Object.keys(cands);
    BOTS.forEach((n,i)=>{ ups[`votes/${m.id}/bot${i}`]={c:biased(ids),by:n,t:Date.now()}; });
  }
  await store.update('',ups);
}
function simView(app){
  ssSet('f40-pin','ok'); app.className='sim';
  app.innerHTML=`<div class="sim-bar"><div><h1>Ensayo · Los 40 del Eze</h1><p class="muted">El celular de un invitado y tu panel, conectados como la noche de la fiesta.</p></div>
      <div class="row"><button class="btn sky" id="sim-bots">Simular 12 invitados</button><button class="btn ghost" id="sim-reset">Empezar de cero</button></div></div>
    <ol class="sim-help">
      <li><span>En tu <b>panel</b>, tocá un atajo (ej: <b>Mejor look mujer</b>) y en su tarjeta, <b>Abrir ahora</b>.</span></li>
      <li><span>En el <b>celular</b>, postulá a alguien o tocá <b>Me postulo yo</b>, y votá.</span></li>
      <li><span>Tocá <b>Simular 12 invitados</b> para sumar candidatos y votos de otros.</span></li>
      <li><span>Tocá <b>Cerrar y mostrar ganador</b>: aparece en el celu, en "Ganadores de la noche".</span></li>
    </ol>
    <div class="sim-main">
      <div class="sim-slot"><span class="lbl">Celular de un invitado</span><div class="sim-phone"><div id="sim-g"></div></div></div>
      <div class="sim-slot"><span class="lbl">Tu panel · en la fiesta lo abrís desde tu celu con PIN ${esc(CONFIG.PIN)}</span><div class="sim-admin"><div id="sim-a"></div></div></div>
    </div>`;
  guestView($('#sim-g')); adminView($('#sim-a'));
  $('#sim-bots').onclick=async e=>{ const b=e.currentTarget; b.disabled=true; b.textContent='Sumando…';
    try{ await simBots(); b.textContent='¡Listo! Otra tanda'; }catch(_){ b.textContent='No se pudo, probá de nuevo'; } b.disabled=false; };
  $('#sim-reset').onclick=async e=>{ const b=e.currentTarget; if(!armed(b,'Tocá de nuevo para borrar todo')) return; await seed(true); location.reload(); };
}

/* ---------- router ---------- */
function route(){
  const h=(location.hash||'').replace('#',''); const app=$('#app');
  if(h==='admin') adminView(app);
  else if(h==='ensayo'||(store.kind==='demo'&&!h)) simView(app);
  else if(h==='jugar') guestView(app);
  else guestView(app);
}
window.addEventListener('hashchange',()=>location.reload());
route();
</script>
